# ledger/test_clauses.toml -- see README.md "Test-to-clause mapping" for the format and the rule.
# HAND-MAINTAINED. Every entry names a test that EXISTS in the final tree (kani 0e71661f1) and was checked by
# reading the test (or the suite's script) against the clause text.
#
# THE RULE. A test is listed against a clause only if it asserts an obligation of that clause on the PRODUCTION
# path, and a clause is evidenced only if the listed tests together cover EVERY obligation of the clause.
#   - A serialization test fed hand-built values (a RunContext, a HarnessSelectionExport) asserts shape, not that a
#     flag or the build produces the value: it is not listed against a clause whose obligation is that derivation.
#   - A test that compares a helper's returned paths is not evidence that a directory is created.
#   - A terminal-document test is not evidence about the INCOMPLETE marker (the writer produces none).
#   - What the claim's own bounds exclude (the temporary file's location, a process kill) is not evidenced.
#   - A clause whose text also states the effect of a flag on verification is evidenced only if a test asserts that
#     effect; a test of the exported mirror of the flag asserts the mirror only.
#   - The `validator` bucket (the reference consumer's fixture checker) maps DECODER-side clauses only: a consumer
#     rejecting a hand-edited document is no evidence that the producer's output conforms.
#   - A clause that says a field IS a real quantity (the Kani release, the build target triple, CBMC's own --version
#     output, the rustc release) is evidenced only by a test that compares the field with that quantity; presence,
#     non-emptiness or the shape of the value is not.
#   - A clause with an "only" / "never" / "exactly" / "every" obligation (an exact key set, an absent field, a
#     universal over the keys of a document) is evidenced only by an assertion of that absence or that full set. A test
#     that reads the named keys does not exclude extra ones, `v["k"].is_null()` on a serde_json value is also true for
#     an absent key, and the validator ignores unknown fields; a suite that runs the validator on its own output is
#     credited with what the suite itself asserts, not with the validator's accept or reject.
# A clause that fails the rule has no [[test]] line. It is listed once under [[partial]] with what IS asserted and what
# is not, and the ledger generator reports it as a gap ("partly evidenced"). The frozen clause inventory is not edited;
# splitting these clauses is a proposal (README.md, "Open points").
#
# Clause RFC0015-S-7.2-13 is deliberately mapped by NO test: its frozen text is the pre-correction precedence ("last
# --cbmc-args override wins"), which the effective-solver tests contradict on repeated flags (the RFC text is
# corrected in PR 1; see the package README).

