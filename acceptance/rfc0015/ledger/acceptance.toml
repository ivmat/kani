[[claim]]
id            = "CONF/RFC0015-S-7.1-63"
clause        = "RFC0015-S-7.1-63"
item          = "§Field reference, other[] element shape, status row"
statement     = "A checks.other[]/covers.other[] entry's status is the actual, unbucketed CheckStatus value; other[] carries only id and status, full property records being reserved for failed_properties[]/unsupported_constructs[]."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: exact set / absence). Asserted: an unexpected status goes to other[] with its actual status string (SATISFIED among checks, SUCCESS among covers) (by export_checks_satisfied_status_falls_to_other, export_covers_unexpected_status_goes_to_other). NOT evidenced: 'other[] carries only id and status' is an exact-key-set obligation: the tests read id and status, none excludes an extra field (the validator ignores unknown fields)."


