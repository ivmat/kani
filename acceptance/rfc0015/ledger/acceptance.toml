[[claim]]
id                 = "CONF/RFC0015-S-4.1-1"
clause             = "RFC0015-S-4.1-1"
item               = "§Why not extend --sarif?, rationale (SARIF comparison)"
statement          = "SARIF could technically carry this data (omitting covers/successes is Kani's own writer choice for --sarif); a separate artifact avoids coupling stable SARIF to unstable schema churn, keeps proof/cover/vacuity detail for CI while scanners keep --sarif's existing empty-results-on-success shape, and sidesteps that SARIF has no native vacuity representation (only generic property bags); both writers project the same upstream VerificationResult/Vec<Property> data rather than sharing one results object."
status             = "not-applicable"
applicability      = "not-applicable"
applicability_reason = "Informative text (motivation, rationale, example or metadata); it states no behavior to check."
clause_source      = "spec-document"


