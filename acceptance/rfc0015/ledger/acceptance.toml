clause             = "RFC0015-S-2.2-1"
item               = "§Relationship to the shipped implementation (#4472), whole subsection (historical baseline + migration assumption)"
statement          = "Historical baseline: the shipped #4472 writer (gated by -Z unstable-options) joins count summaries to detail arrays on harness_id == pretty_name with Rust Debug-cased statuses; this RFC assumes #4472 migrates to the shape defined here (whether it is instead superseded some other way is open), and RFC number 0015 was free because #4472 merged without an RFC of its own."
status             = "not-applicable"
