[[claim]]
id            = "CONF/RFC0015-S-3.3-6"
clause        = "RFC0015-S-3.3-6"
item          = "§Reading the results, Vacuity-suspect (advisory) predicate"
statement     = "The vacuity-suspect predicate -- verdict == SUCCESS && !checks.unreachable.is_empty() -- is an advisory, optional check a consumer may apply to catch partial vacuity the normative predicate misses (at the cost of also flagging deliberately-unreachable assertions); it reads only checks.unreachable, so an unreachable cover (in covers.unreachable) does not satisfy it."
status        = "gap"
applicability = "applicable"
applicability_reason = "Consumer-side rule: verified against Kani's reference consumer, scripts/validate_json_export.py."
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: other). Asserted: the predicate (verdict SUCCESS and a non-empty checks.unreachable), and its inapplicability when assertion_reach_checks is false (by validate_json_export.py). NOT evidenced: no fixture has an unreachable cover with no unreachable check, so 'an unreachable cover does not satisfy it' is not asserted."


[[claim]]
id            = "CONF/RFC0015-S-3.3-7"
clause        = "RFC0015-S-3.3-7"
item          = "§Reading the results, cover-only vacuity recommendation"
statement     = "For cover-only vacuity, a consumer may additionally apply (covers.total > 0 && covers.unreachable.len() == covers.total) per harness; the schema itself does not compute or export this predicate."
status        = "gap"
applicability = "applicable"
applicability_reason = "Consumer-side rule: verified against Kani's reference consumer, scripts/validate_json_export.py."
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: exact set / absence). Asserted: the consumer's cover_only_vacuous predicate (a non-empty covers set, every cover unreachable) on fixtures, including the negative cases (by validate_json_export.py). NOT evidenced: 'the schema itself does not compute or export this predicate' is an absence obligation: no test asserts that an exported document has no such field (the validator ignores unknown fields)."


[[claim]]
id            = "CONF/RFC0015-S-3.3-8"
clause        = "RFC0015-S-3.3-8"
item          = "§Reading the results, Completeness: atomic write rule"
statement     = "Every write produces the full JSON document in a temporary file in the target's own directory, then atomically renames it onto the target path (same-filesystem POSIX rename); a process kill mid-write must never leave a partially written target, only the previous target intact (and possibly an orphaned temp file)."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: same-directory temp file / process kill). Asserted: the full document is written and renamed onto the target (a stale file is replaced); a failed serialization or a failed rename keeps the existing target and leaves no temporary file (by write_json_atomically_overwrites_stale_file, write_json_atomically_preserves_existing_target_when_persist_fails, write_json_atomically_preserves_sentinel_file_when_serialization_fails). NOT evidenced: that the temporary file lives in the target's own directory (no test fails if it is created elsewhere) and a mid-write process kill (never exercised) are not evidenced."


