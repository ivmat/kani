[[claim]]
id            = "CONF/RFC0015-S-3.3-3"
clause        = "RFC0015-S-3.3-3"
item          = "§Reading the results, Bounded results paragraph"
statement     = "harnesses[].is_bounded is true exactly when autoharness generated the harness and bounded at least one argument (because --autoharness-bounded-arguments was passed and the argument's type lacked an unbounded Arbitrary strategy) -- a SUCCESS then proves only inputs within that bound; a manual harness or a generated harness needing no bounded argument reports false, independent of is_ctor_based."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: other). Asserted: is_bounded true for a generated harness with a BoundedArbitrary argument and false for generated harnesses without one and for a manual harness, on one real autoharness run (by autoharness-export). NOT evidenced: independence from is_ctor_based is not tested, and no test runs a bounded argument without --bounded-arguments."


