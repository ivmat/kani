id                 = "CONF/RFC0015-S-4.3-9"
clause             = "RFC0015-S-4.3-9"
item               = "§Compatibility policy, pre-stabilization: release-cycle feedback obligation"
statement          = "Before the flag leaves -Z, at least one release cycle of feedback from a real verdict-level consumer (in-tree or out-of-tree) must be obtained; benchcomp's kani_perf parser does not count as that consumer and its migration is not a prerequisite (it needs solver/symex time, VCC counts and program-step figures excluded here, moved only by a future structured-CBMC-statistics follow-up)."
status             = "gap"
applicability      = "excluded"
applicability_reason = "A before-stabilization obligation; this delivery stays behind -Z export-json and does not stabilize."
scope_ref          = "../applicability.toml#RFC0015-S-4.3-9"
weight             = "unweighted"
grade              = "out-of-scope"
band               = "A0"
clause_source      = "spec-document"


