item               = "§What if we do nothing?, whole subsection"
statement          = "Without this RFC, consumers (including Kani's own tooling) keep scraping rendered text, which fails silently on format changes (a grep matching nothing looks like a run with nothing to report) and still misses vacuity on exit-code-only consumers; doing nothing also lets the shipped document (already metadata.version \\\\\\\"1.0\\\\\\\") become a de-facto, unspecified contract."
status             = "not-applicable"
applicability      = "not-applicable"
applicability_reason = "Informative text (motivation, rationale, example or metadata); it states no behavior to check."
