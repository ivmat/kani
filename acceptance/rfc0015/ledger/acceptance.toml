[[claim]]
id            = "CONF/RFC0015-S-7.1-69"
clause        = "RFC0015-S-7.1-69"
item          = "§Field reference, bucket shape, other[] row"
statement     = "checks.other[]/covers.other[] is never null (may be empty) and holds {id, status} entries per the other[] element shape."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: exact set / absence). Asserted: checks.other[] and covers.other[] are non-null arrays holding entries with id and status (by export_checks_satisfied_status_falls_to_other, export_covers_unexpected_status_goes_to_other). NOT evidenced: 'per the other[] element shape' is exactly id and status (see S-7.1-63): no test excludes an extra field."


