item               = "§User Impact, whole section (motivation)"
statement          = "Motivation: issue #942 requests machine-readable output because existing consumers (e.g. benchcomp's kani_perf parser) regex-scrape rendered text, which silently breaks on format changes; a structured export serves CI dashboards, vacuous-proof detection, cost/outcome collection and retiring Kani's own scraping."
status             = "not-applicable"
