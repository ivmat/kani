[[claim]]
id            = "CONF/RFC0015-S-7.2-1"
clause        = "RFC0015-S-7.2-1"
item          = "§Configuration, assertion_reach_checks table row"
statement     = "configuration.checks.assertion_reach_checks defaults true (disabled by --no-assertion-reach-checks); when true it inserts reach checks before ordinary assertions, and when false it prevents vacuity detection through checks.unreachable."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: flag effect). Asserted: --no-assertion-reach-checks flips the field; the default is true (by configuration_from_serializes_each_check_toggle, live-configuration). NOT evidenced: that reach checks are inserted when true is shown only indirectly, and that vacuity cannot be detected through checks.unreachable when false is not asserted (the run without reach checks only checks the predicates read null)."


[[claim]]
id            = "CONF/RFC0015-S-7.2-2"
clause        = "RFC0015-S-7.2-2"
item          = "§Configuration, ignore_global_asm table row"
statement     = "configuration.checks.ignore_global_asm is set by --ignore-global-asm; when true it suppresses the global_asm! error, so success can be vacuous for behavior reachable only through it."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: flag effect). Asserted: --ignore-global-asm sets the field (by configuration_from_serializes_each_check_toggle). NOT evidenced: the effect of the flag on global_asm! handling is not asserted."


[[claim]]
id            = "CONF/RFC0015-S-7.2-3"
clause        = "RFC0015-S-7.2-3"
item          = "§Configuration, extra_pointer_checks table row"
statement     = "configuration.checks.extra_pointer_checks is set by --extra-pointer-checks; when true it adds invalid-pointer relational-operation and pointer-arithmetic-overflow obligations, making totals not comparable across differing settings."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: flag effect). Asserted: --extra-pointer-checks sets the field (by configuration_from_serializes_each_check_toggle). NOT evidenced: the added pointer obligations, and the incomparable totals, are not asserted."


[[claim]]
id            = "CONF/RFC0015-S-7.2-4"
clause        = "RFC0015-S-7.2-4"
item          = "§Configuration, memory_safety table row"
statement     = "configuration.checks.memory_safety defaults true, disabled either by --no-memory-safety-checks alone or by --no-default-checks (which disables the WHOLE GROUP of default-true checks together, memory_safety included); when false, out-of-bounds accesses and invalid-pointer dereferences go unchecked."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: flag effect). Asserted: --no-memory-safety-checks and --no-default-checks both clear the field (by configuration_from_serializes_each_check_toggle, configuration_from_serializes_no_default_checks_group). NOT evidenced: the effect on out-of-bounds and invalid-pointer checks is not asserted."


[[claim]]
id            = "CONF/RFC0015-S-7.2-5"
clause        = "RFC0015-S-7.2-5"
item          = "§Configuration, overflow table row"
statement     = "configuration.checks.overflow defaults true (disabled by --no-overflow-checks); when false it omits CBMC's NaN and division-by-zero checks specifically, not Rust/MIR arithmetic-overflow or integer division-by-zero assertions (those follow -C overflow-checks=on, subject separately to prove_safety_only)."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: flag effect). Asserted: --no-overflow-checks clears the field (also read back from a live run) (by configuration_from_serializes_each_check_toggle, live-configuration). NOT evidenced: that CBMC's NaN and division-by-zero checks are the ones omitted is not asserted."


[[claim]]
id            = "CONF/RFC0015-S-7.2-6"
clause        = "RFC0015-S-7.2-6"
item          = "§Configuration, unwinding table row"
statement     = "configuration.checks.unwinding defaults true (disabled by --no-unwinding-checks); when false it omits the assertions that loop/recursion bounds cover every execution, so behavior beyond the bound can be missed."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: flag effect). Asserted: --no-unwinding-checks clears the field (by configuration_from_serializes_each_check_toggle). NOT evidenced: the omitted unwinding assertions are not asserted."


[[claim]]
id            = "CONF/RFC0015-S-7.2-7"
clause        = "RFC0015-S-7.2-7"
item          = "§Configuration, undefined_function table row"
statement     = "configuration.checks.undefined_function defaults true (disabled by --no-undefined-function-checks); when false it skips assert-false-assume-false bodies, leaving calls with CBMC's default nondeterministic returns and no modeled side effects."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: flag effect). Asserted: --no-undefined-function-checks clears the field (by configuration_from_serializes_each_check_toggle). NOT evidenced: the effect on undefined-function bodies is not asserted."


[[claim]]
id            = "CONF/RFC0015-S-7.2-8"
clause        = "RFC0015-S-7.2-8"
item          = "§Configuration, assert_contracts table row"
statement     = "configuration.checks.assert_contracts defaults true unless --no-assert-contracts is passed (requires -Z function-contracts); when false, ordinary calls use ContractMode::Original (original body, no contract assertions/assumptions, so success does not establish contract obligations), but an explicit proof_for_contract or stub_verified mode takes precedence and keeps its own instrumentation."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: flag effect). Asserted: --no-assert-contracts (with -Z function-contracts) clears the field (by configuration_from_serializes_assert_contracts_disabled). NOT evidenced: the contract mode used when false, and the precedence of proof_for_contract and stub_verified, are not asserted; that the flag requires -Z function-contracts is not tested negatively."


[[claim]]
id            = "CONF/RFC0015-S-7.2-9"
clause        = "RFC0015-S-7.2-9"
item          = "§Configuration, prove_safety_only table row"
statement     = "configuration.checks.prove_safety_only defaults false and requires -Z unstable-options; when true it converts codegen_assert_assume's PropertyClass::Assertion checks (including user assertions/panics) into assumptions, so success becomes conditional on them, while direct codegen_assert checks (including CheckHook Assertion properties) remain checks -- the conversion depends on code path, not solely on property class."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: flag effect). Asserted: --prove-safety-only (with -Z unstable-options) sets the field (by configuration_from_serializes_prove_safety_only_enabled). NOT evidenced: the conversion of assertion checks to assumptions, and the code-path dependence, are not asserted."


[[claim]]
id            = "CONF/RFC0015-S-7.2-10"
clause        = "RFC0015-S-7.2-10"
item          = "§Configuration, configuration-block membership policy"
statement     = "A flag belongs in the configuration block when it changes which properties are generated or what a status means (two runs differing only in it are not directly comparable, or it can make a passing result prove less than it appears to); the nine checks flags and coverage_enabled are the currently-identified fields meeting that test, and a future flag is added under the same rule (a minor schema change) assessed in the PR that adds it."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"


[[claim]]
id            = "CONF/RFC0015-S-7.2-11"
clause        = "RFC0015-S-7.2-11"
item          = "§Configuration, cbmc_args recording rule"
statement     = "configuration.cbmc_args is the catch-all for direct CBMC options the configuration-block policy cannot name individually (since a --cbmc-args value can change results in ways Kani cannot inspect, two runs with different cbmc_args are not assumed comparable); it is recorded verbatim except for UTF-8 conversion (to_string_lossy; a non-UTF-8 argument renders as U+FFFD rather than round-tripping byte-for-byte), sufficient as a comparability signal but not an exact replayable argv."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"


