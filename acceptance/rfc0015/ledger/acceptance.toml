item          = "§Reading the results, Vacuous pass (normative) predicate"
statement     = "The vacuous-pass predicate -- verdict == SUCCESS && checks.total > 0 && checks.unreachable.len() == checks.total -- is the schema's normative definition of a harness that examined nothing while reporting success (checks.total>0 excludes a checkless harness; the SUCCESS guard excludes failing harnesses; success==0 alone would be unsound because a passing should_panic harness has a FAILURE panic check)."
