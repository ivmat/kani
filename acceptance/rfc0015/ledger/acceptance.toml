[[claim]]
id                 = "CONF/RFC0015-S-4.4-1"
clause             = "RFC0015-S-4.4-1"
item               = "§Why a new artifact rather than extending an existing one?, whole subsection"
statement          = "Existing artifacts each fall short of this contract (kani list --format json is pre-verification metadata, coverage output is per-region data, --output-into-files is split rendered text, .kani-metadata.json is the compiler-to-driver channel, and the per-harness text files that do carry outcomes still lack a structured run-and-verdict contract)."
status             = "not-applicable"
applicability      = "not-applicable"
applicability_reason = "Informative text (motivation, rationale, example or metadata); it states no behavior to check."
clause_source      = "spec-document"


[[claim]]
id                 = "CONF/RFC0015-S-4.5-1"
clause             = "RFC0015-S-4.5-1"
item               = "§Why is CBMC statistics data excluded?, rationale (CBMC statistics excluded)"
statement          = "CBMC statistics (symex time, VCC counts, solver time) are excluded because obtaining them today requires parsing CBMC's free text; moving that scraping into Kani would retain the same fragility benchcomp already has."
