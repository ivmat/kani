statement     = "kani_commit is a nullable string: the git commit Kani was built from; null outside a git checkout."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: CLI/build wiring). Asserted: a given commit string or null is serialized as a nullable string (by export_kani_commit_and_dirty_flag, export_kani_commit_null_when_unavailable). NOT evidenced: the value comes from the build (build.rs); no test reads it from a build, compares it with the real commit, or builds outside a git checkout."


[[claim]]
id            = "CONF/RFC0015-S-7.1-3"
clause        = "RFC0015-S-7.1-3"
item          = "§Field reference, kani_commit_dirty field row"
statement     = "kani_commit_dirty is a nullable bool, null exactly when kani_commit is null; otherwise it records whether the build tree had uncommitted changes."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: CLI/build wiring). Asserted: a given bool or null is serialized as a nullable bool (by export_kani_commit_and_dirty_flag, export_kani_commit_null_when_unavailable). NOT evidenced: the dirty flag is derived in build_run_context from the build's KANI_GIT_DIRTY text; that derivation and its source in build.rs are untested."


