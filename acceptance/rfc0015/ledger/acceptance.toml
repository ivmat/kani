[[claim]]
id            = "CONF/RFC0015-S-7.3-1"
clause        = "RFC0015-S-7.3-1"
item          = "§Failure scenarios, Unwritable path bullet"
statement     = "An unwritable export path produces an error and a non-zero exit, never rewriting the independently computed verification verdict; a marker-write failure occurs before verification, while the terminal export write follows harness verdicts but precedes SARIF output and the final rendered summary (so failure aborts those later steps); whether an export-write failure should also suppress SARIF is left open."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"


