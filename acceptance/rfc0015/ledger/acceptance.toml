applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: CLI/build wiring). Asserted: tools.kani is a non-empty string in a document built from a hand-built context (by export_all_successful). NOT evidenced: that it IS the Kani release (CARGO_PKG_VERSION at build time) is not asserted: the test checks only that the string is non-empty."


[[claim]]
id            = "CONF/RFC0015-S-7.1-5"
clause        = "RFC0015-S-7.1-5"
item          = "§Field reference, tools.rustc field row"
statement     = "tools.rustc is a nullable string: the rustc toolchain kani-compiler was built against; null if that probe failed."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: CLI/build wiring). Asserted: a given rustc string is exported verbatim and a missing one is null; the build records a value shaped like a toolchain release (not the 'using rustc ...' sentence); the tools.rustc of a real run has that shape (by export_tools_rustc_null_when_unavailable, export_tools_rustc_present_when_available, exported_rustc_is_the_build_time_toolchain_release, schema-validation). NOT evidenced: that the value is the rustc release kani-compiler was built against is not asserted (no equality with the real toolchain, only a regular-expression shape), and nothing shows that a failed probe yields null."


