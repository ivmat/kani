[[claim]]
id            = "CONF/RFC0015-S-4.3-1"
clause        = "RFC0015-S-4.3-1"
item          = "§Compatibility policy, Minor-bump bullet"
statement     = "A MINOR schema_version bump adds fields, or adds a newly recognized name to the already-explicitly-open solver-name domains (attributes.solver, resolved_solver) -- it does not convert a previously-closed solver enum into an open one; a consumer must accept an unfamiliar solver-name string as valid regardless, while every other enum stays closed."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: other). Asserted: the writer exports an unfamiliar resolved_solver string; the consumer's closed domains reject unknown failure_kind, outcome kind and status values (by export_solver_domain_accepts_unfamiliar_names, validate_json_export.py). NOT evidenced: the MINOR-bump policy is not behaviour a test can assert, and no consumer fixture carries an unfamiliar solver NAME (fixtures use known names and a path)."


[[claim]]
id            = "CONF/RFC0015-S-4.3-2"
clause        = "RFC0015-S-4.3-2"
item          = "§Compatibility policy, Major-bump bullet"
statement     = "A MAJOR schema_version bump is required to rename/remove a field, change a field's meaning or type, or add a variant to a closed enum (outcome.kind, verdict, failure_kind, run_state, status, attributes.kind) or move a status out of an other[] bucket into a newly named one; a consumer's enum-matching code is still encouraged to keep a default arm."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"


