item          = "§Field reference, harnesses[].outcome.code field row"
statement     = "harnesses[].outcome.code is a nullable integer, present only when outcome.kind is CRASHED (the process exit code, when known)."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: exact set / absence). Asserted: outcome.code is the exit status on CRASHED (101 in a unit test, 1 from a real crash of a fake cbmc) and is absent on TIMEOUT and OUT_OF_MEMORY (by export_with_exit_status_outcomes, structured-warnings). NOT evidenced: 'present only when CRASHED': absence on COMPLETED is asserted by no mapped test's own assertions (the validator run inside a suite accepts or rejects a document, nothing more)."


