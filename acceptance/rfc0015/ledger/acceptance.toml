[[claim]]
id                 = "CONF/RFC0015-S-2.1-1"
clause             = "RFC0015-S-2.1-1"
item               = "§The specific gap: a proof can pass while proving nothing, whole subsection (motivation + scope pointer)"
statement          = "Motivating example: a contradictory kani::assume can make a harness's assertions unreachable while it still reports SUCCESS/exit 0, which exit-code-only consumers cannot distinguish from a meaningful proof; this RFC's scope (relative to the shipped unreachable-count data) is to define property identities, vacuity predicates and completeness, accepting the trade-off that a fixed schema limits future change."
status             = "not-applicable"
applicability      = "not-applicable"
applicability_reason = "Informative text (motivation, rationale, example or metadata); it states no behavior to check."
clause_source      = "spec-document"


