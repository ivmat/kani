[[claim]]
id            = "CONF/RFC0015-S-7.5-12"
clause        = "RFC0015-S-7.5-12"
item          = "§Value domains and casing, Casing rule"
statement     = "A value keeps the serialization of the Rust type it comes from (this schema does not fork a type solely to re-case it): every SCHEMA FIELD NAME (object key naming a document field) is snake_case -- this does not extend to an externally-tagged enum's own tag/variant keys (e.g. \\\"ProofForContract\\\", \\\"Binary\\\"), which retain PascalCase as part of the embedded attribute enum's object-variant shape; outcome/verdict/failure_kind/run_state/status VALUES are SCREAMING_SNAKE_CASE (including new multi-word values)."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: exact set / absence). Asserted: every key a test reads is snake_case; the outcome, verdict, failure_kind, run_state and status values read are SCREAMING_SNAKE_CASE (including OUT_OF_MEMORY, PANICS_ONLY, NO_HARNESSES_SELECTED); the tags ProofForContract and Binary keep their PascalCase (by export_attributes_kind_domain_closed, export_attributes_solver_serializes_named_variants, export_run_level_outcome_has_no_crashed_variant, export_with_exit_status_outcomes, export_with_failed_property). NOT evidenced: 'every schema field name' is a universal over the emitted key set: no test scans all keys of a document (the validator ignores unknown fields), so a non-snake_case extra key would pass."


