[[claim]]
id            = "CONF/RFC0015-S-7.1-58"
clause        = "RFC0015-S-7.1-58"
item          = "§Field reference, property-record shape, file row"
statement     = "A property record's file is a nullable string (never omitted): null when CBMC did not record a source location, otherwise that source file."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
bounds        = "PARTLY EVIDENCED, so a gap (class: exact set / absence). Asserted: file is null when CBMC recorded no source location, and the source file otherwise (by export_failed_property_full_record_fields, export_with_failed_property). NOT evidenced: 'never omitted': `fp[\"file\"].is_null()` on a serde_json value is also true for an ABSENT key, so no test shows that the key is present as null."


