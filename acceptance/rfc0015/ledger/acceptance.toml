[[claim]]
id            = "CONF/RFC0015-S-7.3-3"
clause        = "RFC0015-S-7.3-3"
item          = "§Failure scenarios, Harness timeout/OOM/CBMC crash bullet"
statement     = "A harness timeout, out-of-memory condition, or CBMC crash is recorded as that harness's own outcome and the export file is still written; complete accounting of harness entries is verdict-independent (even if every harness times out); a missing harness entry means run_state PARTIAL (never a crash/timeout placeholder), and a marker-only file means run_state INCOMPLETE."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"


[[claim]]
id            = "CONF/RFC0015-S-7.3-4"
clause        = "RFC0015-S-7.3-4"
item          = "§Failure scenarios, Kani crash bullet"
statement     = "A Kani crash (compiler ICE, driver panic, SIGKILL) after the marker produces no terminal document (the single final verify_project write is bypassed): the INCOMPLETE marker remains in place, or whatever file existed remains if the crash preceded the marker; there is no run-level CRASHED value, though a per-harness CRASHED outcome remains possible inside an otherwise-completed document."
status        = "gap"
applicability = "applicable"
applicability_reason = ""
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"


