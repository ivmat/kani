# RFC15-A1 (R13): stdout, --sarif and --output-into-files are unchanged by --export-json; `-` is a literal filename.
command = "cargo build-dev && cargo run -p compiletest -- --suite json-handler --mode exec --force-rerun additive-output"
expect  = 'test result: ok\. [1-9]\d* passed; 0 failed; 0 ignored'
exit    = 0

[[run]]
id      = "live-configuration-e2e"
kani    = true
# RFC15-13/-14/-22/-24 (R8): non-default configuration and resolved_* values from real runs (solver and unwind precedence,
# bare --smt2, --coverage, check flags).
command = "cargo build-dev && cargo run -p compiletest -- --suite json-handler --mode exec --force-rerun live-configuration"
expect  = 'test result: ok\. [1-9]\d* passed; 0 failed; 0 ignored'
exit    = 0

[[run]]
id      = "no-harnesses-selected-e2e"
kani    = true
# RFC15-05/-26 (R10): a project with no proof harness exports run_state NO_HARNESSES_SELECTED with an empty harnesses[].
command = "cargo build-dev && cargo run -p compiletest -- --suite json-handler --mode exec --force-rerun no-harnesses-selected"
expect  = 'test result: ok\. [1-9]\d* passed; 0 failed; 0 ignored'
exit    = 0

[[run]]
id      = "fail-fast-e2e"
kani    = true
# RFC15-05/-27: --fail-fast keeps the completed harnesses; run_state PARTIAL vs COMPLETE against matched_count.
command = "cargo build-dev && cargo run -p compiletest -- --suite json-handler --mode exec --force-rerun fail-fast"
expect  = 'test result: ok\. [1-9]\d* passed; 0 failed; 0 ignored'
exit    = 0

[[run]]
id      = "jobs-ordering-e2e"
kani    = true
# RFC15-02 (R1): harnesses[] sorted by (crate_name, file, line, name) and identical under --jobs 4 and --jobs 1.
command = "cargo build-dev && cargo run -p compiletest -- --suite json-handler --mode exec --force-rerun jobs-ordering-stable"
expect  = 'test result: ok\. [1-9]\d* passed; 0 failed; 0 ignored'
exit    = 0

[[run]]
id      = "workspace-filter-diagnostic-e2e"
kani    = true
# RFC15-21/-34 (R10): `--exact` with a filter matching in two crates plus a typo filter is rejected, with and without --export-json;
# an existing target is untouched.
command = "cargo build-dev && cargo run -p compiletest -- --suite json-handler --mode exec --force-rerun workspace-filter-diagnostic"
expect  = 'test result: ok\. [1-9]\d* passed; 0 failed; 0 ignored'
exit    = 0

[[run]]
id      = "schema-validation-e2e"
kani    = true
# RFC15-29/-26/-20: a real export validated field by field against the schema template; the tools.rustc/tools.cbmc shapes; then the
# reference consumer's fixture checker.
command = "cargo build-dev && cargo run -p compiletest -- --suite json-handler --mode exec --force-rerun schema-validation"
expect  = 'test result: ok\. [1-9]\d* passed; 0 failed; 0 ignored'
exit    = 0

[[run]]
id      = "harness-filter-no-match-e2e"
kani    = true
# RFC15-21 (R10): script-based-pre/harness_filter_no_match -- a --harness filter matching nothing fails before codegen and export (also
# under --quiet), names every filter, and leaves an existing export untouched.
command = "cargo build-dev && cargo run -p compiletest -- --suite script-based-pre --mode exec --force-rerun harness_filter_no_match"
expect  = 'test result: ok\. [1-9]\d* passed; 0 failed; 0 ignored'
exit    = 0

# =================================================================================================
# CONTROLS -- every control applies a real unified diff to the kani worktree, runs `command`, and
# requires `expect_red` in the output; the worktree is reverted byte-exactly afterwards. A control's
# `claim` names the claim it was written for; an evidence entry of another claim may cite it too
# (its own `[claim.evidence.control] of_claim` says which claim it tests there).
# =================================================================================================

