clause      = ["R1"]
patch       = "evidence/patches/rfc15-01-schema-version-constant-changed.patch"
command     = "cargo test -p kani-driver schema_utils::tests::export_all_successful"
kani        = false
expect_red  = 'right: "0\.1\.0"'

