# evidence/recipes.toml -- the evidence GENERATOR's registry (see ../gen_evidence.py, README.md
# "Evidence generation"). Every record this package relies on is produced by running exactly one
# of the `[[run]]`/`[[control]]` recipes below against the kani worktree, never hand-written.
#
# `[[run]]`: a command that must PASS (`expect` matches its combined stdout+stderr, `exit` is its
# expected exit code). `[[control]]`: a real unified diff (`patch`, under evidence/patches/) that
# `gen_evidence.py` applies, runs `command` against, requires to go RED (`expect_red` matches the
# output), then reverts byte-exactly.
#
# `kani = true` recipes invoke the real kani/cbmc toolchain and MUST run one at a time through
# `gen_evidence.py`'s systemd-run wrapper (memory-capped, swap off, sequential). `kani = false` recipes are plain
# `cargo`/`python3`/`bash` — no solver involved.
#
# Every `[[claim.evidence]]` entry in acceptance.toml carries its own `recipe = "<id>"` field
# naming the run/control below that produced it (gen_evidence.py rewrites that ONE entry's
# record/record_hash/captured_at_commit; see README.md "Evidence generation").
#
# This file carries no absolute, machine-local paths (README.md "Portable paths"): `<cbmc>` below
# is a placeholder gen_evidence.py substitutes at run time from `--cbmc-dir`/`RFC0015_CBMC_DIR`;
# `$HOME`/`$PWD`/`$PATH` are left for the shell that runs each recipe to expand. The kani worktree
# itself is not named here at all — it comes only from `--kani-worktree`/`RFC0015_KANI_WORKTREE`.

[defaults]
# Prepended to PATH for every command this generator runs (both kani=true and kani=false
# recipes): the pinned cbmc/kani toolchain, the worktree's own scripts/, then cargo, then
# whatever the shell already has.
path_prefix = "<cbmc>/usr/bin:$HOME/.kani/kani-0.67.0/bin:$PWD/scripts:$HOME/.cargo/bin:$PATH"
rust_test_threads = "4"
# Memory-capped, swap-off, one at a time.
systemd_memory_max = "24G"
systemd_memory_swap_max = "0"

# =================================================================================================
# RUNS
# =================================================================================================

[[run]]
id      = "kani-driver-unit-suite"
command = "cargo test -p kani-driver"
kani    = false
# Intentionally does not hard-code the total test count (it grows as tests are added): only the
# shape "N passed; 0 failed" is required.
expect  = 'test result: ok\. [1-9]\d* passed; 0 failed; 0 ignored'
exit    = 0

[[run]]
id      = "json-handler-exec-suite"
command = "cargo build-dev && cargo run -p compiletest -- --suite json-handler --mode exec --force-rerun"
kani    = true
expect  = 'test result: ok\. [1-9]\d* passed; 0 failed; 0 ignored'
exit    = 0

[[run]]
id      = "validator-fixtures"
# The reference consumer's own fixture checker (the script the schema-validation e2e suite ends with), run on its
# own: pure python3, no kani/cbmc, no cargo build. It checks every fixture and twin, every malformed-document case
# (diagnostic text included), every extension, the reading predicates, id_class and join_key.
command = "cd tests/json-handler/schema-validation && python3 check_fixtures.py ../../../scripts/validate_json_export.py && echo 'check_fixtures: every valid fixture and twin accepted, every malformed one rejected, every extension accepted, every predicate checked'"
kani    = false
expect  = 'check_fixtures: every valid fixture and twin accepted, every malformed one rejected, every extension accepted, every predicate checked'
exit    = 0

[[run]]
id      = "clippy"
command = "cargo clippy -p kani-driver --tests -- -D warnings"
kani    = false
expect  = 'Finished `dev` profile'
exit    = 0

[[run]]
id      = "fmt-check"
command = "./scripts/kani-fmt.sh --check"
kani    = false
# rustfmt --check prints nothing on success; exit code is the real signal here.
expect  = '.*'
exit    = 0

[[run]]
id      = "kani-driver-branch-coverage"
kani    = false
# Branch coverage of the --export-json writer in kani-driver/src/frontend/schema_utils.rs, from the unit-test
# suite (no kani/cbmc run involved). `cargo llvm-cov --branch` needs `llvm-tools-preview` for the pinned nightly
# toolchain. The python step reads cargo-llvm-cov's own `--json` export and prints ONE stable line that
# `coverage_value_regex` parses -- no hand-computed number. Branch regions are unioned over generic
# instantiations (an arm is covered when ANY instantiation took it, as llvm-cov's own file summary does);
# regions at or after the file's own `#[cfg(test)]` line are test code and are excluded (their count is printed,
# not hidden); a region whose counts are 0/0 in every instantiation is compiler-folded or sits in code the unit
# tests never enter (KaniSession::write_export_json itself) and is excluded exactly as llvm-cov's summary
# excludes it.
command = '''
set -euo pipefail
cargo llvm-cov --branch -p kani-driver --json --output-path target/rfc0015-schema-utils-branch-coverage.json
python3 - "target/rfc0015-schema-utils-branch-coverage.json" <<'PYEOF'
import json, sys
doc = json.load(open(sys.argv[1]))
files = doc["data"][0]["files"]
matches = [f for f in files if f["filename"].endswith("kani-driver/src/frontend/schema_utils.rs")]
if len(matches) != 1:
    raise SystemExit(f"expected exactly one file entry for schema_utils.rs, got {len(matches)}: {[m['filename'] for m in matches]}")
path = matches[0]["filename"]
test_start = next(i for i, l in enumerate(open(path), 1) if l.strip() == "#[cfg(test)]")
regions = {}
for b in matches[0]["branches"]:
    regions.setdefault(tuple(b[:4]), []).append((b[4], b[5]))
covered = total = test_regions = 0
for (line, *_), arms in sorted(regions.items()):
    true_n, false_n = (sum(a[i] for a in arms) for i in (0, 1))
    if true_n == 0 and false_n == 0:
        continue
    if line >= test_start:
        test_regions += 1
        continue
    total += 2
    covered += (true_n > 0) + (false_n > 0)
value = covered / total if total else 0.0
print(f"RFC0015_BRANCH_COVERAGE file=kani-driver/src/frontend/schema_utils.rs covered={covered} total={total} value={value:.6f} test_code_regions_excluded={test_regions} test_starts_at_line={test_start}")
PYEOF
'''
expect  = 'RFC0015_BRANCH_COVERAGE file=kani-driver/src/frontend/schema_utils\.rs covered=\d+ total=\d+ value=\d+\.\d+'
exit    = 0
coverage_value_regex = 'RFC0015_BRANCH_COVERAGE .*\bvalue=([0-9]+\.[0-9]+)'
  [run.coverage]
  metric = "branch"
  of     = "kani-driver/src/frontend/schema_utils.rs: the --export-json writer and its helpers (non-test code only: regions at or after the file's own #[cfg(test)] line are excluded; branch regions unioned over generic instantiations; 0/0 regions excluded as llvm-cov's summary excludes them)"

[[run]]
id      = "call-cbmc-verdict-branch-coverage"
kani    = false
# R4 scope: the verdict/failure-kind functions of kani-driver/src/call_cbmc.rs -- verification_outcome_from_properties
# (626-645), determine_failed_properties (648-667), VerificationResult::from (472-528) and the two helpers that decide
# whether CBMC's results are used, cbmc_completed_results (443-449) and cbmc_reported_out_of_memory (453-458), where
# RFC15-15's logic lives. Measured by LINE RANGE over cargo-llvm-cov's per-branch TEXT report: its explicit per-branch
# `[True: N, False: N]` / `[Folded - Ignored]` annotations are the ground truth the file-level summaries are built
# from (a raw JSON entry with (0,0) is ambiguous between folded and never-executed). The python step asserts that
# each range still starts at its function, so a moved function fails the recipe instead of silently measuring
# other code.
command = '''
set -euo pipefail
cargo llvm-cov --branch -p kani-driver --text --output-path target/rfc0015-call-cbmc-verdict-branch-coverage.txt
python3 - "target/rfc0015-call-cbmc-verdict-branch-coverage.txt" <<'PYEOF'
import re, sys
text = open(sys.argv[1]).read()
parts = re.split(r'^(.*kani-driver/src/\S+\.rs):$', text, flags=re.MULTILINE)
sections = {parts[i]: parts[i + 1] for i in range(1, len(parts), 2)}
matches = [k for k in sections if k.endswith("kani-driver/src/call_cbmc.rs")]
if len(matches) != 1:
    raise SystemExit(f"expected exactly one file section for call_cbmc.rs, got {len(matches)}: {matches}")
section = sections[matches[0]]
source = open(matches[0]).read().split("\n")
ranges = [(443, 449, "fn cbmc_completed_results("), (453, 458, "fn cbmc_reported_out_of_memory("), (472, 528, "    pub(crate) fn from("), (626, 645, "fn verification_outcome_from_properties("), (648, 667, "fn determine_failed_properties(")]
for lo, hi, start in ranges:
    if not source[lo - 1].startswith(start):
        raise SystemExit(f"line {lo} of call_cbmc.rs is {source[lo - 1]!r}, expected it to start with {start!r}")
covered = 0
total = 0
for m in re.finditer(r'Branch \((\d+):(\d+)\): \[(.*?)\]', section):
    line = int(m.group(1))
    status = m.group(3)
    if not any(lo <= line <= hi for lo, hi, _ in ranges):
        continue
    if status.strip() == "Folded - Ignored":
        continue
    tm = re.match(r'True:\s*(\d+),\s*False:\s*(\d+)', status)
    if not tm:
        raise SystemExit(f"unrecognized branch status at line {line}: {status!r}")
    t, f = int(tm.group(1)), int(tm.group(2))
    total += 2
    covered += (1 if t > 0 else 0) + (1 if f > 0 else 0)
value = covered / total if total else 0.0
print(f"RFC0015_CALL_CBMC_VERDICT_BRANCH_COVERAGE covered={covered} total={total} value={value:.6f}")
PYEOF
'''
expect  = 'RFC0015_CALL_CBMC_VERDICT_BRANCH_COVERAGE covered=\d+ total=\d+ value=\d+\.\d+'
exit    = 0
coverage_value_regex = 'RFC0015_CALL_CBMC_VERDICT_BRANCH_COVERAGE .*\bvalue=([0-9]+\.[0-9]+)'
  [run.coverage]
  metric = "branch"
  of     = "kani-driver/src/call_cbmc.rs: branches inside verification_outcome_from_properties (626-645), determine_failed_properties (648-667), VerificationResult::from (472-528), cbmc_completed_results (443-449) and cbmc_reported_out_of_memory (453-458) ONLY, by source line range over cargo-llvm-cov's per-branch text report (see this recipe's own comment)"

# End-to-end suites (kani/cbmc, one at a time through the capped service). Each runs ONE suite of tests/json-handler
# (or the script-based-pre case named) against the dev build.

[[run]]
id      = "vacuity-check-e2e"
kani    = true
# RFC15-23 (R5): the vacuity-check fixture -- vacuous_pass()/vacuity_suspect() over six harnesses, with and without reach checks.
command = "cargo build-dev && cargo run -p compiletest -- --suite json-handler --mode exec --force-rerun vacuity-check"
expect  = 'test result: ok\. [1-9]\d* passed; 0 failed; 0 ignored'
exit    = 0

[[run]]
id      = "multi-crate-export-e2e"
kani    = true
# RFC15-17 (R9): a real 2-crate `cargo kani --workspace -Z export-json` run -- one file, four harnesses keyed by (crate_name, name).
command = "cargo build-dev && cargo run -p compiletest -- --suite json-handler --mode exec --force-rerun multi-crate-export"
expect  = 'test result: ok\. [1-9]\d* passed; 0 failed; 0 ignored'
exit    = 0

[[run]]
id      = "structured-warnings-e2e"
kani    = true
# RFC15-25/-30/-20: a fake cbmc (the real one for the completed cases) -- warning caps and exact record text on every outcome,
# CRASHED/TIMEOUT/OUT_OF_MEMORY field shapes and elapsed times, the ignored-quantifier ERROR classification.
command = "cargo build-dev && cargo run -p compiletest -- --suite json-handler --mode exec --force-rerun structured-warnings"
expect  = 'test result: ok\. [1-9]\d* passed; 0 failed; 0 ignored'
exit    = 0

[[run]]
