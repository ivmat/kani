# =================================================================================================
# CLAIM.EVIDENCE -> RECIPE binding: each `[[claim.evidence]]` entry in acceptance.toml carries
# its own `recipe = "<run-or-control-id>"` field directly (see gen_evidence.py's
# `update_acceptance_toml`). gen_evidence.py
# rewrites each evidence entry IN ISOLATION (splitting the claim's text at every
# `[[claim.evidence]]` marker before doing any regex work), so two entries citing the same
# recipe/record for the same claim (there are several: RFC15-20 and RFC15-A1 each cite
# `kani-driver-unit-suite` / `json-handler-exec-suite` more than once) are no longer ambiguous --
# there is nothing left here to enumerate; the binding lives with the claim, not the generator.
# =================================================================================================
