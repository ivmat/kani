# ---------------------------------------------------------------------------------------------
[[requirement]]
id            = "R6"
statement     = "--export-json requires its own -Z export-json unstable feature, and combinations that cannot produce real results (--output-format=old, --only-codegen) are rejected before verification starts."
mandatory     = true
waivable      = false
domain        = "compatibility"
clause_source = "spec-document"
