# R7 — writes are atomic
# ---------------------------------------------------------------------------------------------
[[requirement]]
id            = "R7"
statement     = "Every write goes to a temporary file in the target's own directory and is renamed onto the target, a missing parent directory is created first, and an interrupted write never leaves a partially written target."
mandatory     = true
waivable      = false
domain        = "availability"
clause_source = "spec-document"
external_ref  = "RFC 0015 §Reading the results (Completeness); §Failure scenarios"
firmness      = "firm"
