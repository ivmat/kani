# RFC 0015 §Reading the results (Selection, Completeness); §Field reference (harness_selection)
[[claim]]
id            = "RFC15-27"
clause        = "R1"
item          = "kani-driver/src/frontend/schema_utils.rs (HarnessSelectionExport, compute_unmatched_filters, build_run_context)"
statement     = "harness_selection serializes requested_filters (raw --harness values, empty when unfiltered), exact, unmatched_filters (the requested filters matching nothing, by substring or by exact name under --exact) and matched_count (the pre-verification match count)."
status        = "evidenced"
weight        = "weighted"
grade         = "test-only"
band          = "A1"
clause_source = "spec-document"
bounds        = "bounded: unit tests build the run context directly (a one-filter and a two-filter case); matched_count's production assembly in build_run_context is covered end to end (fail-fast and multiple-harnesses read it back from real runs; control rfc15-27-matched-count-off-by-one). RESIDUAL: the production assembly of requested_filters, exact and unmatched_filters from the CLI arguments (the other lines of build_run_context) has NO test that reads them back from a real run -- mutating them leaves every test green -- so only their serialization and the unmatched-filter computation are evidenced."
captured_at_commit = "df3e37771821750a6e888c01b2d88611485cd991"

  [claim.self_verify]
  command = "cargo test -p kani-driver schema_utils::tests::export_harness_selection_and_configuration"
  expect  = "test result: ok. 1 passed; 0 failed"

