# RFC 0015 §Failure scenarios
[[claim]]
id            = "RFC15-30"
clause        = "R9"
item          = "kani-driver/src/frontend/schema_utils.rs (per-harness outcome); kani-driver/src/call_cbmc.rs (VerificationResult::from, run_cbmc_piped)"
statement     = "a harness timeout, out-of-memory or CBMC crash is recorded as that harness's outcome.kind (TIMEOUT only under --harness-timeout; OUT_OF_MEMORY inferred from CBMC child status 137 with no property array; CRASHED with code/message) and the file is still written; the run-level outcome.kind has no CRASHED value."
status        = "evidenced"
weight        = "weighted"
grade         = "test-only"
band          = "A1"
clause_source = "spec-document"
bounds        = "bounded: one harness per outcome in the unit test and one per outcome in the fake-cbmc e2e (a crash exits 1; the OOM case kills the child with SIGKILL; the timeout case blocks and is cancelled by --harness-timeout 2s), each asserting that the file exists with the right outcome.kind and code. 'TIMEOUT only under --harness-timeout' is not tested negatively: ExitStatus::Timeout is constructed only inside the `if let Some(timeout)` branch of run_cbmc_piped (by reading), and no test runs without --harness-timeout to show TIMEOUT unreachable -- a disclosed residual. The run-level outcome has a single COMPLETED variant (RunOutcome), so a run-level CRASHED is unrepresentable."
captured_at_commit = "0e71661f12396b2df509b5397975f130854832c6"

