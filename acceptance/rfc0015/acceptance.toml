# RFC 0015 §Field reference (kani_commit, tools.*)
[[claim]]
id            = "RFC15-29"
clause        = "R8"
item          = "kani-driver/src/frontend/schema_utils.rs (build_run_context, ToolsExport, build_rustc_release); kani-driver/src/version.rs (cbmc_version_on_path); kani-driver/build.rs"
statement     = "kani_commit is null outside a git checkout and kani_commit_dirty is null exactly then; tools.kani is always known; tools.rustc and tools.cbmc are null, never guessed, when unknown; tools.rustc is the toolchain release Kani was built with and tools.cbmc is CBMC's `--version` output; enabled_unstable_features is the sorted list of active -Z flags."
