# RFC 0015 §Configuration (resolved_solver); this delivery exports what CBMC runs and corrects the RFC text
[[claim]]
id            = "RFC15-13"
clause        = "R8"
item          = "kani-driver/src/frontend/schema_utils.rs (effective_solver, SMT_SOLVER_PRIORITY); kani-driver/src/call_cbmc.rs (solver_flags)"
statement     = "resolved_solver is the solver CBMC runs, computed from Kani's own solver flags (CLI --solver > harness attribute > default) followed by --cbmc-args, by CBMC's own rules: a named SMT flag outranks the SAT flags, several named SMT flags resolve by CBMC's fixed priority whatever their order, the first occurrence of a repeated --sat-solver, --external-sat-solver or --external-smt2-solver wins, with --external-smt2-solver <path> (or, with no named SMT flag, --incremental-smt2-solver <path>) the exported value is <path>, and a bare --smt2 lets CBMC choose and yields null."
status        = "evidenced"
weight        = "weighted"
grade         = "test-only"
band          = "A1"
clause_source = "spec-document"
bounds        = "FOLLOWS THE CORRECTED RFC TEXT, NOT THE PINNED COPY: the pinned RFC copy (spec/0015-export-json.txt) says 'last solver-selecting --cbmc-args override > CLI --solver'; this delivery exports what CBMC 6.11.0 actually does and the corrected RFC text (rfc/src/rfcs/0015-export-json.md) is merged upstream at bf9c58e66, so the pinned copy and clause RFC0015-S-7.2-13 of the frozen inventory still carry the old wording; re-pinning spec/ and the clause titles is a pending consumer act (see README.md, \"Open points for the consumer\"). The cases of effective_solver_tests were checked against CBMC 6.11.0 (probe table in the writer PR description); this package re-runs only Kani's side. bounded: seven named SMT flags, the pairwise priority order, one SAT-flag pair per rule; combinations CBMC rejects outright (an SMT flag with --external-sat-solver, a named flag with --incremental-smt2-solver) are best effort because the harness then does not complete; non-UTF-8 arguments are not tested. e2e: live-configuration reads resolved_solver back from real runs (attribute, --solver, a same-family --cbmc-args flag that must NOT override, an SMT --cbmc-args flag that must, bare --smt2) and compares it with the solver line CBMC itself prints in each run; the control for that comparison makes Kani pass CaDiCaL's flags for a MiniSAT harness, so CBMC runs CaDiCaL while the export says minisat."
captured_at_commit = "df3e37771821750a6e888c01b2d88611485cd991"

  [claim.self_verify]
  command = "cargo test -p kani-driver frontend::schema_utils::tests::effective_solver_tests::named_smt_override_wins_over_sat_base"
  expect  = "test result: ok. 1 passed; 0 failed"

