# RFC 0015 §The specific gap; §Reading the results (Vacuous pass)
[[claim]]
id            = "RFC15-23"
clause        = "R5"
item          = "kani-driver/src/frontend/schema_utils.rs (checks.unreachable, bucket_by_status's identity export); scripts/validate_json_export.py (vacuous_pass, vacuity_suspect)"
statement     = "under configuration.checks.assertion_reach_checks == true, a harness whose assertions are all unreachable (a contradictory kani::assume) exports outcome.verdict SUCCESS with checks.total > 0 and checks.unreachable.len() == checks.total, so a consumer can apply the RFC's vacuous-pass predicate; the unreachable identities are exported, not only a count."
status        = "evidenced"
weight        = "weighted"
grade         = "test-only"
band          = "A1"
clause_source = "spec-document"
bounds        = "bounded: seven harnesses in one e2e fixture (contradictory assume; partly vacuous, with one reachable and one unreachable assertion; real failure; real success; checkless success; expected-panic success; expected-panic failing with all checks unreachable), once with reach checks on and once with them off (predicates then null); the unit test uses one two-check contradictory harness. The three e2e controls make the validator's predicates wrong (total >= 0 for vacuous_pass, vacuous_pass on any unreachable check, vacuity_suspect only when all checks are unreachable); no control mutates the producer's unreachable bucket at e2e level (the unit control does, at unit level)."
captured_at_commit = "df3e37771821750a6e888c01b2d88611485cd991"

  [claim.self_verify]
  command = "cargo build-dev && cargo run -p compiletest -- --suite json-handler --mode exec --force-rerun vacuity-check"
  expect  = "test result: ok. 1 passed; 0 failed"

