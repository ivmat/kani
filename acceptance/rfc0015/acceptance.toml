# RFC 0015 §Configuration (resolved_unwind); this delivery exports what CBMC runs and corrects the RFC text
[[claim]]
id            = "RFC15-14"
clause        = "R8"
item          = "kani-driver/src/frontend/schema_utils.rs (resolve_effective_unwind); kani-driver/src/call_cbmc.rs (resolve_unwind_value)"
statement     = "resolved_unwind is the bound CBMC uses: Kani's own bound (CLI --unwind > harness #[kani::unwind] > --default-unwind) when there is one, otherwise the first --unwind in --cbmc-args (Kani's flags come first on CBMC's command line and CBMC takes the first occurrence); null when neither exists or a raw value does not parse."
