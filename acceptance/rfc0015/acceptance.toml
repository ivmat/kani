weight        = "weighted"
grade         = "test-only"
band          = "A1"
clause_source = "spec-document"
bounds        = "bounded: the null mapping is asserted on hand-built run contexts; the shape of the REAL tools.rustc (release, not the display sentence) and tools.cbmc (full `--version` output) is asserted on one real export. RESIDUAL: build.rs's own probes (git sha, dirty flag, rustc) are not exercised in a non-git build, and the dirty flag can go stale after unstaged edits (disclosed in the description of #4941)."
