sh of this package (a class B8 borrow) and this package embeds the hash of evidence[0]'s record, so the record can only describe the ledger/package PAIR that existed when the check ran -- the pair committed just before it (see the record's own header: the repository commit it ran at). The final ledger is regenerated from the final package afterwards and re-validated by the same command (and by every validator command in README.md), but evidence[0]'s transcript is of the previous pair; the ledger, its generator and its inputs are otherwise identical."
