id            = "RFC15-16"
clause        = "R3"
item          = "kani-driver/src/frontend/schema_utils.rs (Summary::from_harnesses); scripts/validate_json_export.py (check_summary)"
statement     = "summary.* is computed per the RFC's table: total == harnesses.len(); successful/failed count COMPLETED harnesses by verdict; checks_total, checks_success, covers_total, covers_satisfied sum over COMPLETED harnesses only; successful + failed <= total with the gap exactly the non-COMPLETED count; null is never counted as zero."
status        = "evidenced"
weight        = "weighted"
grade         = "test-only"
band          = "A1"
clause_source = "spec-document"
bounds        = "bounded: one COMPLETED and one contrived non-COMPLETED harness (a TIMEOUT harness that deliberately carries a satisfied cover entry, which must not leak into covers_satisfied); the consumer recomputes every summary field and is checked with each field off by one and with a summary that counts a non-COMPLETED harness."
captured_at_commit = "0e71661f12396b2df509b5397975f130854832c6"

