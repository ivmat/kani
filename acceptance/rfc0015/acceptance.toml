# RFC 0015 §Reading the results (Completeness)
[[claim]]
id            = "RFC15-06"
clause        = "R10"
item          = "kani-driver/src/main.rs (verify_project, between harness selection and verification)"
statement     = "after building and selecting harnesses, when verification begins, an atomic INCOMPLETE marker replaces any earlier file at the path; the marker contains the known pre-verification fields and omits outcome, wall_time_s, summary and harnesses[]."
status        = "partial"
weight        = "unweighted"
grade         = "test-only"
band          = "A1"
clause_source = "spec-document"
bounds        = "UNWEIGHTED ON PURPOSE: this claim evidences only part of R10; R10 as a whole is NOT discharged (crash kinds other than SIGKILL, the atomicity of the marker write and the failure of the terminal write are not evidenced -- see the R10 deviation), so the evidence is shown but not relied upon to satisfy R10. PARTIAL: the atomicity of the marker write is not observed. bounded: one end-to-end suite, json-handler/incomplete-marker, with a fake CBMC (a wrapper that blocks until a release file exists) on one fixture. It shows, mid-run, a file at the path with run_state INCOMPLETE that replaced a seeded COMPLETE document (its started_at differs), carries none of outcome, wall_time_s, summary and harnesses[], and passes the reference validator; after release the terminal document carries the same started_at and the same other fields as the marker; a marker write error (an output path below a regular file) ends the run with a non-zero exit before CBMC starts; a rejected selection leaves the seeded file unchanged (RFC15-34), so the marker is written only after selection. The suite retries on a partial read and never asserts that a reader cannot see one, so atomicity is not shown. The two controls make the marker be built but not written, and swallow the marker's write error."
gaps          = ["The atomicity of the marker write is not observed: the suite retries on a partial read and never asserts that a reader cannot see one."]
