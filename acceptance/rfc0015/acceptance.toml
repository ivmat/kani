# RFC 0015 §Failure scenarios; §Field reference (warnings)
[[claim]]
id            = "RFC15-25"
clause        = "R9"
item          = "kani-driver/src/call_cbmc.rs (Warning, truncate_warning, CapturedWarnings, warning_capturing_filter); kani-driver/src/frontend/schema_utils.rs; scripts/validate_json_export.py (warnings_shape_equivalent)"
statement     = "harnesses[].warnings[] carries WARNING-typed --json-ui messages as {message, truncated, original_chars} with a fixed per-message character cap (original_chars null exactly when not truncated) and a fixed count cap; warnings_truncated counts entries dropped by the count cap, zero if none; the same caps apply for every harness outcome; messages are retained only when --export-json is set."
status        = "evidenced"
weight        = "weighted"
grade         = "test-only"
band          = "A1"
clause_source = "spec-document"
bounds        = "bounded: caps MAX_WARNING_MESSAGE_CHARS = 4096 characters and MAX_WARNINGS_PER_HARNESS = 20 (this implementation's own fixed choices); unit boundary cases at cap-1, cap, cap+1, cap+500 and at 20, 21, 23 warnings; one real child process emitting 25 warnings and then blocking, cancelled the way --harness-timeout cancels it (the capture survives); the fake-cbmc e2e uses one stress set (multibyte text, one message exactly at and one just over the character cap, 22 messages) on COMPLETED, CRASHED, TIMEOUT and OUT_OF_MEMORY harnesses and compares the complete expected records and the omitted count. The run_cbmc_piped timeout WIRING is exercised by the e2e timeout case, not by a unit test. The consumer's warnings_shape_equivalent (message text deliberately not compared) is exercised on eight cases."
captured_at_commit = "df3e37771821750a6e888c01b2d88611485cd991"

