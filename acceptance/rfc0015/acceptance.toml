# RFC 0015 §Reading the results (Completeness); §Failure scenarios
[[claim]]
id            = "RFC15-07"
clause        = "R7"
item          = "kani-driver/src/frontend/schema_utils.rs (write_json_atomically)"
statement     = "every write serializes the full document into a temporary file, syncs it and renames it onto the target; a failed write -- a serialization error after partial output, or a failed rename -- leaves any existing target intact and leaves no temporary file behind, so a reader never sees a partially written target."
status        = "evidenced"
weight        = "weighted"
grade         = "test-only"
band          = "A1"
clause_source = "spec-document"
bounds        = "bounded: failure injection by a value whose Serialize fails after 64 KiB of output (target keeps its sentinel bytes), and by a rename onto a non-empty directory (target and its content survive); success cases include a stale file, no stale file, a 255-byte destination name and a created file mode equal to std::fs::write's. RESIDUAL: the statement says nothing about WHERE the temporary file lives, because no test fails if it is created outside the target's directory (checked once by hand: replacing `tempfile_in(dir)` with `tempfile()` keeps every unit and e2e test green); same-directory placement holds by construction (tempfile_in(export_parent_dir(path))) and is what makes the rename atomic. A mid-write kill of the process (SIGKILL) is not exercised."
captured_at_commit = "df3e37771821750a6e888c01b2d88611485cd991"

  [claim.self_verify]
  command = "cargo test -p kani-driver schema_utils::tests::write_json_atomically_preserves_sentinel_file_when_serialization_fails"
  expect  = "test result: ok. 1 passed; 0 failed"

    [claim.self_verify.watched_fail]
    of_command = "cargo test -p kani-driver schema_utils::tests::write_json_atomically_preserves_sentinel_file_when_serialization_fails"
