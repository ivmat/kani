# RFC 0015 §Interaction with other flags (multi-crate)
[[claim]]
id            = "RFC15-17"
clause        = "R9"
item          = "kani-driver/src/main.rs (verify_project); kani-driver/src/call_cargo.rs (cargo_build)"
statement     = "a multi-crate cargo kani invocation writes one file per invocation covering every harness in the run, distinguished by crate_name; a later crate's results do not overwrite an earlier crate's."
status        = "evidenced"
weight        = "weighted"
grade         = "test-only"
band          = "A1"
clause_source = "spec-document"
bounds        = "bounded: one two-crate workspace with a same-named harness in each crate (check_shared) plus one distinct harness per crate, run with `cargo kani --workspace`; the four (crate_name, name) keys must each appear exactly once and the summary reads 4/4/0. The 'one write, not one per crate' fact is read from the single resulting file; no control forces a per-crate overwrite (the e2e control blanks crate_name, which makes the same-named harnesses collide; its patch also removes the suite's `| tail -1` from the validator call, so the record keeps the consumer's own diagnostic: (crate_name, name) ('', 'check_shared') occurs 2 times)."
