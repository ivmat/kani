clause        = "R12"
item          = "scripts/validate_json_export.py"
statement     = "the reference consumer also implements the RFC's selection guidance (a generated harness is never selectable by name; a contract-proof harness is selected by its own function path, not its contract target), does not assume an output_dir, and never reads an omitted disclosure as unrestricted proofs."
