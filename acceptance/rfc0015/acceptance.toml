# RFC 0015 §Failure scenarios
[[claim]]
id            = "RFC15-35"
clause        = "R10"
item          = "kani-driver/src/main.rs (verify_project: single terminal write)"
statement     = "a Kani crash after the marker (compiler ICE, driver panic, SIGKILL) leaves the INCOMPLETE marker in place and writes no terminal document; a crash before the marker leaves whatever file existed; there is no run-level CRASHED value, only per-harness CRASHED inside a completed document."
status        = "gap"
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
why_a0        = "Marker not implemented in the stack (see RFC15-06 and the R10 deviation); the 'no run-level CRASHED value' half is a type fact evidenced under RFC15-30."

# RFC 0015 §Failure scenarios
[[claim]]
id            = "RFC15-36"
clause        = "R10"
item          = "kani-driver/src/frontend/schema_utils.rs (writer) with the marker step in main.rs"
statement     = "an existing file at the path is atomically replaced by the INCOMPLETE marker when verification begins after building, and the terminal document later atomically replaces the marker; concurrent writers to one path are unsupported and last rename wins."
status        = "gap"
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
why_a0        = "Marker not implemented in the stack (see RFC15-06 and the R10 deviation). The terminal document's atomic replacement of an existing file is evidenced under RFC15-07."

# RFC 0015 §Failure scenarios; §Reading the results (Completeness)
[[claim]]
id            = "RFC15-38"
clause        = "R10"
item          = "kani-driver/src/frontend/schema_utils.rs (run_state derivation, harness accounting)"
statement     = "complete accounting is verdict-independent: a run in which every harness times out, runs out of memory or crashes still writes a terminal document with run_state COMPLETE; a harness with no entry at all makes the document PARTIAL, and missing entries are never crash/timeout placeholders and do not establish whether the harness ran."
status        = "gap"
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
why_a0        = "No test makes every harness of a run time out, run out of memory or crash and reads run_state back. The derivation compares results.len() with matched_count (verdict-independent by construction) and PARTIAL is evidenced under RFC15-05, but the all-non-COMPLETED case itself is unasserted."


