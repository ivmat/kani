# RFC 0015 §Failure scenarios
[[claim]]
id            = "RFC15-30"
clause        = "R9"
item          = "kani-driver/src/frontend/schema_utils.rs (per-harness outcome); kani-driver/src/call_cbmc.rs (VerificationResult::from, run_cbmc_piped)"
statement     = "a harness timeout, out-of-memory or CBMC crash is recorded as that harness's outcome.kind and the file is still written: TIMEOUT only under --harness-timeout; OUT_OF_MEMORY inferred from CBMC child status 137 or from CBMC's own `Out of memory` report, even when a property array exists; a property array counts only when CBMC printed its overall status after it and CBMC's exit status shows it finished reporting (0, 10, or 6 with an ERROR property), otherwise the harness is CRASHED with that status as code and \"CBMC failed with status N\" as message (\"CBMC did not finish reporting its results (exit status N)\" when the array came without CBMC's overall status); the run-level outcome.kind has no CRASHED value."
status        = "partial"
weight        = "weighted"
grade         = "test-only"
band          = "A1"
clause_source = "spec-document"
bounds        = "bounded: one harness per outcome in the unit test and one per outcome in the fake-cbmc e2e (a crash exits 1; the OOM case kills the child with SIGKILL; the timeout case blocks and is cancelled by --harness-timeout 2s), each asserting that the file exists with the right outcome.kind and code. The mapping from CBMC's exit status and results to the exported outcome is evidenced at unit level by export_outcome_follows_cbmc_exit_status_and_results: twelve cases of (exit status, one property with a given status, whether CBMC reported `Out of memory`, whether CBMC reported its overall prover status) run through VerificationResult::from and the exporter (0, 10 and 6 with an ERROR property, each with the prover status, give COMPLETED; the OOM report, also with an ERROR property, and 137 give OUT_OF_MEMORY; 6 without an ERROR property and 139, both without the prover status, give CRASHED with that code and the message \"CBMC did not finish reporting its results (exit status N)\", and only status 5, the one row that reports the prover status, gives CRASHED with the message \"CBMC failed with status 5\"; results without CBMC's prover status give CRASHED with the exit status as code even for 0, 10 and 6 with an ERROR property (upstream #4928), with the message \"CBMC did not finish reporting its results (exit status N)\"). The `Out of memory` report path has NO end-to-end test: the fake cbmc of the OOM e2e case is killed with SIGKILL, which exercises the status-137 path only. The clause inventory's OUT_OF_MEMORY row (RFC0015-S-7.5-10) predates the RFC sentence that is now corrected upstream (bf9c58e66); re-pinning spec/ and the clause title is a pending consumer act, and the clause is credited only for its stated 137 case (README, Open points). 'TIMEOUT only under --harness-timeout' is not tested negatively: ExitStatus::Timeout is constructed only inside the `if let Some(timeout)` branch of run_cbmc_piped (by reading), and no test runs without --harness-timeout to show TIMEOUT unreachable -- a disclosed residual. The run-level outcome has a single COMPLETED variant (RunOutcome), so a run-level CRASHED is unrepresentable. PARTIAL: two rules of the statement have no test that isolates them. Of the 144 controls of this package at this subject, 142 are red and two are not: `rfc15-30-oom-report-not-checked-before-trusting-array` (mutant: the `!cbmc_reported_out_of_memory(..)` condition removed from the condition for using CBMC's results) and `rfc15-30-status-6-trusted-without-error-property` (mutant: exit status 6 trusted without an ERROR property). Upstream's prover-status rule (#4928) rejects the same results first: every table row with exit status 6 and no ERROR property, or with an `Out of memory` message, has no prover status. The behaviour in the statement holds at the subject by reading `cbmc_completed_results` / `VerificationResult::from`; no table row isolates it, so a mutant of either rule is not caught. The two recipes stay in evidence/recipes.toml; no evidence entry cites them. Two further rows would isolate them: (exit status 6, Success, no `Out of memory`, prover status reported -> CRASHED with code 6) and (6, Error, `Out of memory`, prover status reported -> OUT_OF_MEMORY); they were tried with a temporary patch, not applied, since the subject is not edited here."
gaps          = ["No test isolates two rules of the statement: the Out of memory report checked before a result array is trusted, and exit status 6 trusted only with an ERROR property (controls rfc15-30-oom-report-not-checked-before-trusting-array and rfc15-30-status-6-trusted-without-error-property are not red at this subject)."]
