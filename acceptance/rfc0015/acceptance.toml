# RFC 0015 §Reading the results; §Compatibility policy; §Open questions (consumer prohibitions) -- the reference consumer as it stands at the stack top
[[claim]]
id            = "RFC15-D1"
clause        = "R12"
item          = "scripts/validate_json_export.py + tests/json-handler/schema-validation/ (check_fixtures.py, fixtures, schema template)"
statement     = "Kani's reference consumer, scripts/validate_json_export.py, accepts every valid RFC 0015 document it is given (unknown fields are ignored, any solver name is accepted, an INCOMPLETE marker is checked against its own column), refuses the schema version it does not support, rejects documents that break the RFC's cross-field rules (presence by outcome, buckets, summary, run_state, selection, ordering, failure_kind) with a diagnostic naming the rule, and implements the RFC's reading rules: the vacuous-pass, vacuity-suspect and cover-only-vacuous predicates, the (crate_name, name) join key and the message-agnostic warnings comparison."
status        = "evidenced"
weight        = "unweighted"
grade         = "test-only"
band          = "A1"
clause_source = "spec-document"
bounds        = "UNWEIGHTED ON PURPOSE: this claim evidences the rules the final reference consumer keeps; R12's text also lists rules the consumer dropped (RFC15-D2, the R12 deviation), so R12 as a whole is NOT discharged and this evidence is shown but not relied upon to satisfy it. bounded: the fixture set is five documents (completed failure, completed success, non-COMPLETED outcomes, NO_HARNESSES_SELECTED, INCOMPLETE marker), six valid twins, 120 malformed-document cases (each one edit away from a valid base, asserting the diagnostic text and the absence of a traceback), eleven extension cases, fifteen predicate cases, eight join_key/warnings cases and twelve id_class ids; the controls below each disable ONE rule family (the sweep that disabled each of the validator's 50 error sites separately, run during review, is outside this package). Tests of the consumer's own selection and output_dir guidance do not exist -- those rules were removed from the consumer when it was shrunk and are now the gap claim RFC15-D2. The consumer never infers unrestricted inputs from is_bounded == false: there is no code path that could, and no test asserts the absence."
captured_at_commit = "0e71661f12396b2df509b5397975f130854832c6"

