# RFC 0015 §Reading the results (Completeness); §Rationale (Summary)
[[claim]]
id            = "RFC15-05"
clause        = "R10"
item          = "kani-driver/src/frontend/schema_utils.rs (RunState, ExportedRun::from_harness_results); scripts/validate_json_export.py (check_run_state)"
statement     = "run_state is present in every terminal document and obeys: NO_HARNESSES_SELECTED <=> requested_filters == [] and harness_selection.matched_count == 0 (then summary.total == 0 too); otherwise COMPLETE <=> summary.total == matched_count (every selected harness has an entry, regardless of outcome) and PARTIAL <=> total < matched_count. The zero-harness case (total == matched_count == 0) is NO_HARNESSES_SELECTED, never COMPLETE; a non-empty filter list with matched_count == 0 never reaches the writer (the command line rejects it before export) and the consumer rejects such a document."
status        = "evidenced"
weight        = "unweighted"
grade         = "test-only"
band          = "A1"
clause_source = "spec-document"
bounds        = "UNWEIGHTED ON PURPOSE: this claim evidences only the part of R10 that PR 1 delivers; R10 as a whole is NOT discharged (the INCOMPLETE marker is not implemented -- see the R10 deviation), so the evidence is shown but not relied upon to satisfy R10. PARTIAL DISCHARGE OF R10: terminal documents only. The INCOMPLETE value and the marker are not written by anything in this stack (RFC15-06, -35, -36 stay gaps); the INCOMPLETE sentence of the earlier statement ('has no summary and these identities do not apply') moved to those rows. bounded: the derivation is asserted on three hand-built contexts (COMPLETE, PARTIAL 1-of-50, NO_HARNESSES_SELECTED) and end to end by fail-fast (PARTIAL when a harness is skipped, COMPLETE when the abort lands on the last), multiple-harnesses (COMPLETE) and no-harnesses-selected. The derivation compares results.len() with matched_count, so it is verdict-independent by construction (RFC15-38 stays a gap: no test makes every harness time out, crash or run out of memory and reads run_state). The zero-harness edge is covered from both sides: an unfiltered run with no matches is NO_HARNESSES_SELECTED (unit test and real run), and the consumer's fixture case 'COMPLETE although nothing matched' is rejected. The writer would derive COMPLETE for 0 results against 0 matches only when the filter list is non-empty, which no command line reaches and no test builds. In the end-to-end control the patch also removes the suite's `| tail -1` from its validator calls (no assertion changes), so the record keeps the validator's own rule text (run_state COMPLETE but summary.total (2) != matched_count (3))."
captured_at_commit = "0e71661f12396b2df509b5397975f130854832c6"

