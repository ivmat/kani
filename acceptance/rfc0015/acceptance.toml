# =============================================================================================
# R14
# =============================================================================================

# RFC 0015 §Open questions (--object-bits); §Out of scope / Future Improvements (provenance)
[[claim]]
id            = "RFC15-P1"
clause        = "R14"
item          = "upstream issues on model-checking/kani"
statement     = "Tracking issues for the --object-bits provenance representation and for full tool/solver provenance and host metadata exist upstream, filed on RFC adoption."
status        = "gap"
weight        = "unweighted"
grade         = "not-covered"
band          = "A0"
clause_source = "spec-document"
why_a0        = "No tracking issue is filed: a process fact no test can assert; see the R14 deviation."


# =============================================================================================
# Deviations — mandatory requirements this delivery does not (fully) satisfy, declared up front
# =============================================================================================
[[deviation]]
requirement      = "R10"
kind             = "partial"
statement        = "Parts of the INCOMPLETE-marker contract are not evidenced at this subject. The marker is written by upstream's #5062, and the end-to-end suite json-handler/incomplete-marker shows it written when verification begins, with only the pre-verification fields, left unchanged by a driver killed with SIGKILL, and replaced by the terminal document (RFC15-06, -35, -36; partial). Not evidenced: (1) crash kinds other than SIGKILL after the marker (a compiler ICE, a driver panic); (2) that the marker write is atomic, so that a reader never sees a partial file (the suite retries on a partial read and does not assert it); (3) the failure of the terminal write (the second half of S-7.3-1), which no test provokes end to end; (4) the all-non-COMPLETED accounting case (RFC15-38), which no test asserts. (The terminal run_state values, the run-level presence of a terminal document, the NO_HARNESSES_SELECTED rule and untouched files after rejected arguments, rejected filters or compilation errors ARE implemented and evidenced: RFC15-05, -21, -26, -34.)"
cause            = "The marker landed upstream (#5062) after the writer (#4941). Its end-to-end suite provokes one crash kind (SIGKILL) and observes the file only by polling, and it injects no terminal-write failure. No test makes every harness of a run time out, run out of memory or crash."
impact           = "A run killed by a signal other than SIGKILL, a compiler ICE or a driver panic after the marker is written is not shown to leave the marker; a failing terminal write is not shown to leave it either. A consumer must not treat the absence of a marker as proof of completion. A reader that polls the file while the marker is written is not shown to be safe from a partial file."
remedy           = "Add tests for the other crash kinds, for the atomicity of the marker write, for a failing terminal write, and for the all-non-COMPLETED accounting case (RFC15-38); a later package discharges this deviation."
waiver_requested = true

[[deviation]]
requirement      = "R12"
kind             = "unmet"
statement        = "The reference consumer no longer carries the RFC's selection guidance (generated harnesses are not selectable by name; contract-proof harnesses are selected by their own function path), the no-assumed-output_dir rule, or any check for the no-inference-of-unrestricted-proofs rule beyond is_bounded => is_automatically_generated (RFC15-D2)."
cause            = "Decision of 2026-10-01: the reference consumer is shrunk and its dead or redundant rules deleted; the selector helpers and the output_dir rule had no reachable consumer."
impact           = "R12's text still lists these rules, so the requirement is only partly delivered: what the consumer does implement is evidenced (RFC15-D1), what it dropped is a visible gap (RFC15-D2). A consumer of the document gets no help from the reference script on those three guidance points."
remedy           = "Consumer: narrow R12 to the rules the reference consumer keeps (proposal in README.md, \"Open points for the consumer\"), or restore the dropped rules in a later PR with tests."
waiver_requested = false

[[deviation]]
requirement      = "R14"
kind             = "unmet"
statement        = "The tracking issues R14 asks for (filed upstream on RFC adoption, for the effective --object-bits provenance representation and for full tool/solver provenance and host machine metadata) are not filed."
cause            = "A later decision changed how these two items are delivered: instead of being tracked as open issues, they are implemented directly in a later stabilization PR, together with the other open questions that PR resolves. Neither the writer, the reference consumer nor the end-to-end-test PR of this stack does either."
impact           = "Until that PR lands, the export carries neither the effective --object-bits representation nor full tool/solver provenance and host machine metadata, and no upstream issue tracks either gap in the meantime."
remedy           = "The later stabilization PR implements both items (or the issues are filed); its package discharges this deviation."
waiver_requested = true
