item          = "kani-driver/src/frontend/schema_utils.rs (effective_solver, SMT_SOLVER_PRIORITY); kani-driver/src/call_cbmc.rs (solver_flags)"
statement     = "resolved_solver is the solver CBMC runs, computed from Kani's own solver flags (CLI --solver > harness attribute > default) followed by --cbmc-args, by CBMC's own rules: a named SMT flag outranks the SAT flags, several named SMT flags resolve by CBMC's fixed priority whatever their order, the first occurrence of a repeated --sat-solver, --external-sat-solver or --external-smt2-solver wins, with --external-smt2-solver <path> (or, with no named SMT flag, --incremental-smt2-solver <path>) the exported value is <path>, and a bare --smt2 lets CBMC choose and yields null."
