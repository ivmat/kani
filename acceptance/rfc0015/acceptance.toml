# RFC 0015 §Reading the results (Completeness); §Failure scenarios
[[claim]]
id            = "RFC15-34"
clause        = "R10"
item          = "kani-driver/src/main.rs (verify_project ordering); kani-driver/src/args/mod.rs; kani-driver/src/metadata.rs"
statement     = "rejected arguments, rejected filters and compilation errors occur before any export is written and leave any existing file or directory at the --export-json path untouched."
status        = "evidenced"
weight        = "unweighted"
grade         = "test-only"
band          = "A1"
clause_source = "spec-document"
bounds        = "UNWEIGHTED ON PURPOSE: this claim evidences only part of R10; R10 as a whole is NOT discharged (crash kinds other than SIGKILL, the atomicity of the marker write, the failure of the terminal write and the all-non-COMPLETED accounting case (RFC15-38) are not evidenced -- see the R10 deviation), so the evidence is shown but not relied upon to satisfy R10. PARTIAL DISCHARGE OF R10: the earlier statement also said 'stale results are invalidated only from the marker onward'; that part is carried by RFC15-06 and RFC15-36 (the marker replaces the file only when verification begins), not here. bounded: the gate-rejections e2e keeps a sentinel file (or directory) untouched across seven rejected invocations (no gate, only -Z unstable-options, --output-format=old, --only-codegen, --no-codegen, -Z lean, an existing directory) and across one compilation error (one fixture that fails with rustc error E0308; this leg does reach compilation); workspace-filter-diagnostic keeps a sentinel export untouched across a rejected filter set, and incomplete-marker keeps a seeded terminal document byte-identical across a rejected --harness filter. script-based-pre/harness_filter_no_match shows only that a zero-match filter fails before export (its untouched-file leg moved to incomplete-marker). The controls are delete-up-front mutations in the driver (the RFC's own alternative design): before the filter check (workspace-filter-diagnostic and incomplete-marker) and before compilation (the compilation-error leg, standalone path); the argument-validation rejections have no dedicated 'deleted early' control."
captured_at_commit = "df3e37771821750a6e888c01b2d88611485cd991"

