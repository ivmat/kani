# RFC 0015 §Value domains and casing (failure_kind truth table); model-checking/kani#4719
[[claim]]
id            = "RFC15-15"
clause        = "R4"
item          = "kani-driver/src/call_cbmc.rs (verification_outcome_from_properties, determine_failed_properties, VerificationResult::from's #4719 override); kani-driver/src/frontend/schema_utils.rs; scripts/validate_json_export.py (verdict rule)"
statement     = "failure_kind and outcome.verdict follow the RFC's truth table over attributes.should_panic x FailedProperties (should_panic=false: NONE->SUCCESS, PANICS_ONLY/OTHER/ERROR->FAILURE; should_panic=true: PANICS_ONLY->SUCCESS, NONE/OTHER/ERROR->FAILURE); failure_kind's own value is NONE/PANICS_ONLY/OTHER by failing-property status and class, ERROR whenever any property carries CheckStatus::Error (checked first, taking priority); #4719's computed ERROR/FAILURE override for ignored quantifiers is preserved rather than recomputed from properties alone; failure_kind is present (one of NONE/PANICS_ONLY/OTHER/ERROR) exactly on a COMPLETED harness and absent otherwise; and a decoder must read attributes.should_panic before interpreting failure_kind against outcome.verdict, since the two should_panic values disagree on which failure_kind means SUCCESS."
status        = "evidenced"
weight        = "weighted"
grade         = "test-only"
band          = "A1"
clause_source = "spec-document"
bounds        = "bounded: the 4x2 truth table is enumerated exhaustively in one unit test (four property sets x should_panic false/true); the classification test uses five hand-built sets; the override is one set with a warning-typed message and one without. The consumer's verdict rule is exercised on the expected-panic twin and on a verdict contradicting failure_kind. e2e: the vacuity-check run covers a should_panic harness that succeeds (PANICS_ONLY) and one that fails with no property failing (NONE); the structured-warnings quantifier case covers the override end to end (FAILURE/ERROR with no ERROR property) -- but no control targets those two e2e facts, so only the unit-level controls count."
captured_at_commit = "0e71661f12396b2df509b5397975f130854832c6"

