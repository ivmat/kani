item          = "kani_metadata/src/harness.rs (HarnessMetadata.is_bounded) as surfaced by schema_utils.rs; kani-compiler/src/kani_middle/codegen_units.rs (AutoHarnessCaveats.is_bounded)"
statement     = "is_bounded is mandatory and true exactly when autoharness generated the harness and bounded at least one argument under --autoharness-bounded-arguments because its type lacked an unbounded Arbitrary strategy; manual harnesses and generated harnesses needing no bounded argument report false, independent of is_ctor_based."
