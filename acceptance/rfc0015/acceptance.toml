# RFC 0015 §Presence matrices (run level)
[[claim]]
id            = "RFC15-26"
clause        = "R10"
item          = "kani-driver/src/frontend/schema_utils.rs (ExportedRun, run-level fields); scripts/validate_json_export.py (template, required fields)"
statement     = "run-level presence of a terminal document matches the RFC's matrix: schema_version, kani_commit(_dirty), tools.*, enabled_unstable_features, harness_selection.*, harness_timeout_s, configuration.*, target and started_at (null where unknown), run_state, outcome, wall_time_s, summary and harnesses[] are all present, and harnesses[] is empty under NO_HARNESSES_SELECTED (the converse, 'empty only then', is not asserted: see the bounds). (The marker's column of the matrix is RFC15-06.)"
status        = "evidenced"
weight        = "unweighted"
grade         = "test-only"
band          = "A1"
clause_source = "spec-document"
bounds        = "UNWEIGHTED ON PURPOSE: this claim evidences only the part of R10 that PR 1 delivers; R10 as a whole is NOT discharged (the INCOMPLETE marker is not implemented -- see the R10 deviation), so the evidence is shown but not relied upon to satisfy R10. PARTIAL DISCHARGE OF R10: the terminal-document column only; the marker column (run_state always INCOMPLETE; outcome, wall_time_s, summary, harnesses[] absent) is carried by RFC15-06 and is not produced by the writer. bounded: unit tests assert wall_time_s, target, summary and the harness-level fields; every other required run-level key is checked by the reference consumer's template on every real export of every e2e suite (a missing key is a validation failure), shown by the harness_timeout_s control in the schema-validation suite. Under NO_HARNESSES_SELECTED a harness entry is rejected by the consumer (fixture case) and one real run has an empty harnesses[]. The converse (another run_state with an empty harnesses[]) is neither rejected by the consumer (a PARTIAL document with zero entries validates) nor tested, so this claim does not state it."
