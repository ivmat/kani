[standard]
id         = "rfc0015-export-json"
title      = "Kani RFC 0015 -- Structured Verification Results (export-json)"
edition    = "merged 2026-09-24 (upstream c610df629)"
provenance = "external"
slice      = false
slice_note = "Whole RFC: every heading (S-1..S-7.5 per the spec_inventory.py heading run) is in scope, including informative/rationale sections, the open-questions and out-of-scope sections (each item still gets a row so applicability can mark it not-applicable/excluded), and normative-but-deferred pre-stabilization obligations (flagged in a trailing comment on those rows). Granularity is one clause per normative UNIT (a table row, a bulleted item, a named predicate/rule), not per sentence; sentences belonging to one such unit are merged into that unit's single clause."
numbering  = "RFC0015-<heading-item>-<n>: <heading-item> is the S-<n>[.<m>] id from spec_inventory.py make applied to spec/0015-export-json.txt (one id per level-2/level-3 Markdown heading, in document order, never from a number already in the heading text); <n> is this row's 1-based position among the units this inventory records under that heading, in the heading's own reading order."

