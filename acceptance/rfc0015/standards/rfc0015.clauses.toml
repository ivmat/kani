[[clause]]
id    = "RFC0015-S-2-1"
ref   = "§User Impact, whole section (motivation)"
title = "Motivation: issue #942 requests machine-readable output because existing consumers (e.g. benchcomp's kani_perf parser) regex-scrape rendered text, which silently breaks on format changes; a structured export serves CI dashboards, vacuous-proof detection, cost/outcome collection and retiring Kani's own scraping."
force = "informative"
side  = "both"
# seed: none
# applicability-hint: not-applicable (informative)

[[clause]]
id    = "RFC0015-S-2.1-1"
ref   = "§The specific gap: a proof can pass while proving nothing, whole subsection (motivation + scope pointer)"
title = "Motivating example: a contradictory kani::assume can make a harness's assertions unreachable while it still reports SUCCESS/exit 0, which exit-code-only consumers cannot distinguish from a meaningful proof; this RFC's scope (relative to the shipped unreachable-count data) is to define property identities, vacuity predicates and completeness, accepting the trade-off that a fixed schema limits future change."
force = "informative"
side  = "both"
# seed: none
# applicability-hint: not-applicable (informative)

[[clause]]
id    = "RFC0015-S-2.2-1"
ref   = "§Relationship to the shipped implementation (#4472), whole subsection (historical baseline + migration assumption)"
title = "Historical baseline: the shipped #4472 writer (gated by -Z unstable-options) joins count summaries to detail arrays on harness_id == pretty_name with Rust Debug-cased statuses; this RFC assumes #4472 migrates to the shape defined here (whether it is instead superseded some other way is open), and RFC number 0015 was free because #4472 merged without an RFC of its own."
force = "informative"
side  = "both"
# seed: none
# applicability-hint: not-applicable (informative)
# the migration assumption ties to open question RFC0015-S-5-1

