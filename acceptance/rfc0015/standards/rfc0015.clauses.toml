[[clause]]
id    = "RFC0015-S-4.1-1"
ref   = "§Why not extend --sarif?, rationale (SARIF comparison)"
title = "SARIF could technically carry this data (omitting covers/successes is Kani's own writer choice for --sarif); a separate artifact avoids coupling stable SARIF to unstable schema churn, keeps proof/cover/vacuity detail for CI while scanners keep --sarif's existing empty-results-on-success shape, and sidesteps that SARIF has no native vacuity representation (only generic property bags); both writers project the same upstream VerificationResult/Vec<Property> data rather than sharing one results object."
force = "informative"
side  = "both"
# seed: none
# applicability-hint: not-applicable (informative)

[[clause]]
id    = "RFC0015-S-4.1-2"
ref   = "§Why not extend --sarif?, '--sarif stays unchanged' rule"
title = "This RFC does not change --sarif's own output."
force = "shall"
side  = "encoder"
# seed: none

[[clause]]
id    = "RFC0015-S-4.1-3"
ref   = "§Why not extend --sarif?, cross-artifact consistency practice"
