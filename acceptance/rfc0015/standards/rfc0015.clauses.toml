[[clause]]
id    = "RFC0015-S-3.3-1"
ref   = "§Reading the results, Selection paragraph, name identity"
title = "harnesses[].name is the fully qualified pretty_name (module path included; bare name only at crate root)."
force = "definition"
side  = "decoder"
# seed: none

[[clause]]
id    = "RFC0015-S-3.3-2"
ref   = "§Reading the results, Selection paragraph, generated-harness prohibition"
title = "A generated (autoharness) harness's exported name must never be used as a --harness selector value."
force = "shall-not"
side  = "decoder"
# seed: none

[[clause]]
id    = "RFC0015-S-3.3-3"
ref   = "§Reading the results, Bounded results paragraph"
title = "harnesses[].is_bounded is true exactly when autoharness generated the harness and bounded at least one argument (because --autoharness-bounded-arguments was passed and the argument's type lacked an unbounded Arbitrary strategy) -- a SUCCESS then proves only inputs within that bound; a manual harness or a generated harness needing no bounded argument reports false, independent of is_ctor_based."
force = "shall"
side  = "encoder"
# seed: RFC15-19

[[clause]]
id    = "RFC0015-S-3.3-4"
ref   = "§Reading the results, vacuity-predicates precondition"
title = "Both the vacuous-pass and vacuity-suspect predicates read outcome.verdict and checks.*, and are inapplicable when configuration.checks.assertion_reach_checks is false (a contradictory assumption can then leave assertions counted in checks.success, so that run cannot report vacuity through checks.unreachable)."
force = "definition"
side  = "decoder"
# seed: none

[[clause]]
id    = "RFC0015-S-3.3-5"
ref   = "§Reading the results, Vacuous pass (normative) predicate"
title = "The vacuous-pass predicate -- verdict == SUCCESS && checks.total > 0 && checks.unreachable.len() == checks.total -- is the schema's normative definition of a harness that examined nothing while reporting success (checks.total>0 excludes a checkless harness; the SUCCESS guard excludes failing harnesses; success==0 alone would be unsound because a passing should_panic harness has a FAILURE panic check)."
force = "shall"
side  = "decoder"
# seed: RFC15-23

[[clause]]
id    = "RFC0015-S-3.3-6"
ref   = "§Reading the results, Vacuity-suspect (advisory) predicate"
title = "The vacuity-suspect predicate -- verdict == SUCCESS && !checks.unreachable.is_empty() -- is an advisory, optional check a consumer may apply to catch partial vacuity the normative predicate misses (at the cost of also flagging deliberately-unreachable assertions); it reads only checks.unreachable, so an unreachable cover (in covers.unreachable) does not satisfy it."
force = "may"
side  = "decoder"
# seed: none

[[clause]]
id    = "RFC0015-S-3.3-7"
ref   = "§Reading the results, cover-only vacuity recommendation"
title = "For cover-only vacuity, a consumer may additionally apply (covers.total > 0 && covers.unreachable.len() == covers.total) per harness; the schema itself does not compute or export this predicate."
force = "may"
side  = "decoder"
# seed: none

[[clause]]
id    = "RFC0015-S-3.3-8"
ref   = "§Reading the results, Completeness: atomic write rule"
title = "Every write produces the full JSON document in a temporary file in the target's own directory, then atomically renames it onto the target path (same-filesystem POSIX rename); a process kill mid-write must never leave a partially written target, only the previous target intact (and possibly an orphaned temp file)."
force = "shall"
side  = "encoder"
# seed: RFC15-07

[[clause]]
id    = "RFC0015-S-3.3-9"
ref   = "§Reading the results, Completeness: INCOMPLETE marker rule"
title = "An atomic INCOMPLETE marker replaces any earlier file at the export path once verification begins, after harness building and selection; the marker contains the known pre-verification fields and omits outcome, wall_time_s, summary and harnesses[]."
force = "shall"
side  = "encoder"
# seed: RFC15-06
# applicability-hint: applicable, PR 2

[[clause]]
id    = "RFC0015-S-3.3-10"
ref   = "§Reading the results, check-order echo"
title = "A consumer checks schema_version first, then run_state."
force = "shall"
side  = "decoder"
# seed: RFC15-01
# RFC0015-S-4.3-7 (Semver-zero) supplies the schema_version-first assertion but does not itself state the subsequent run_state check; this clause states the full check-order instruction (was informally cross-referenced as 'S-4.3-6' in r0 -- corrected).

[[clause]]
id    = "RFC0015-S-3.3-11"
ref   = "§Reading the results, run_state trust-guarantee rule"
title = "run_state COMPLETE guarantees every selected harness has an entry, regardless of its own outcome -- the only value that is complete verification evidence."
force = "definition"
side  = "both"
# seed: RFC15-05
# applicability-hint: applicable, PR 2

[[clause]]
id    = "RFC0015-S-3.3-12"
ref   = "§Reading the results, compilation-errors-precede-marker rule"
title = "A compilation error or a rejected filter set occurs before the INCOMPLETE marker is written and leaves any existing file at the path untouched; stale results are invalidated only from the marker onward."
force = "shall"
side  = "encoder"
# seed: RFC15-34
# applicability-hint: applicable, PR 2

[[clause]]
id    = "RFC0015-S-3.3-13"
ref   = "§Reading the results, marker-design fail-open/fail-closed disclosure"
title = "Disclosed property of the marker design: an existence-only consumer fails open on a verdict-less marker, whereas a hypothetical delete-up-front design would instead fail closed on ENOENT."
force = "informative"
side  = "decoder"
# seed: none
# applicability-hint: not-applicable (informative)

[[clause]]
id    = "RFC0015-S-3.3-14"
ref   = "§Reading the results, concurrent-writers rule"
title = "Concurrent writers to one export path are unsupported: the last rename to complete wins."
force = "definition"
side  = "encoder"
# seed: RFC15-36
# applicability-hint: applicable, PR 2

[[clause]]
id    = "RFC0015-S-3.3-15"
ref   = "§Reading the results, NO_HARNESSES_SELECTED / unmatched-filters rule"
title = "run_state NO_HARNESSES_SELECTED means an unfiltered project/workspace had no selectable proof harness or eligible autoharness function: requested_filters == [], unmatched_filters == [], matched_count == 0."
force = "shall"
side  = "encoder"
# seed: RFC15-21
# applicability-hint: applicable, PR 2

[[clause]]
id    = "RFC0015-S-3.3-16"
ref   = "§Reading the results, run_state naming history"
title = "Proposed run_state replaces the PoC's run_complete field (a naming/history note; the marker-versus-deletion design choice remains open -- see the Marker or delete-up-front open question)."
force = "informative"
side  = "both"
# seed: none
