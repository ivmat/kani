side  = "encoder"
# seed: RFC15-16

[[clause]]
id    = "RFC0015-S-4.2-8"
ref   = "§Summary (summary.*), non-COMPLETED-harness effect on summary"
title = "A non-COMPLETED harness counts in neither summary.successful nor summary.failed (so successful + failed <= total, the gap exactly the non-COMPLETED count), contributes nothing to the check/cover sum fields, and is never counted as zero when null."
force = "shall"
side  = "encoder"
# seed: RFC15-16

[[clause]]
id    = "RFC0015-S-4.2-9"
ref   = "§Summary (summary.*), COMPLETE/PARTIAL total-vs-matched_count identity"
title = "run_state COMPLETE implies summary.total == harness_selection.matched_count and PARTIAL implies total < matched_count; a missing entry (the PARTIAL gap) is never a crash/timeout placeholder and does not itself establish whether that harness ran (#4744)."
force = "shall"
side  = "encoder"
# seed: RFC15-05
# applicability-hint: applicable, PR 2

[[clause]]
id    = "RFC0015-S-4.2-10"
ref   = "§Summary (summary.*), NO_HARNESSES_SELECTED identity"
title = "run_state NO_HARNESSES_SELECTED implies matched_count == 0 == total and requested_filters == []."
force = "shall"
side  = "encoder"
# seed: RFC15-05
# applicability-hint: applicable, PR 2

[[clause]]
id    = "RFC0015-S-4.2-11"
ref   = "§Summary (summary.*), INCOMPLETE-has-no-summary rule"
title = "run_state INCOMPLETE has no summary field, and the total/matched_count identities above do not apply to it."
force = "definition"
side  = "encoder"
# seed: RFC15-05
# applicability-hint: applicable, PR 2

[[clause]]
id    = "RFC0015-S-4.3-1"
ref   = "§Compatibility policy, Minor-bump bullet"
title = "A MINOR schema_version bump adds fields, or adds a newly recognized name to the already-explicitly-open solver-name domains (attributes.solver, resolved_solver) -- it does not convert a previously-closed solver enum into an open one; a consumer must accept an unfamiliar solver-name string as valid regardless, while every other enum stays closed."
force = "shall"
side  = "both"
# seed: RFC15-04

[[clause]]
id    = "RFC0015-S-4.3-2"
ref   = "§Compatibility policy, Major-bump bullet"
title = "A MAJOR schema_version bump is required to rename/remove a field, change a field's meaning or type, or add a variant to a closed enum (outcome.kind, verdict, failure_kind, run_state, status, attributes.kind) or move a status out of an other[] bucket into a newly named one; a consumer's enum-matching code is still encouraged to keep a default arm."
force = "shall"
side  = "encoder"
# seed: none

[[clause]]
id    = "RFC0015-S-4.3-3"
ref   = "§Compatibility policy, Ignore-unknown-fields bullet"
title = "A consumer must ignore an unrecognized field within an accepted major version, rather than rejecting the document for it."
force = "shall"
side  = "decoder"
# seed: none

[[clause]]
id    = "RFC0015-S-4.3-4"
ref   = "§Compatibility policy, Refuse-unknown-majors bullet"
title = "A consumer must refuse a schema_version whose major component it does not recognize, since existing fields may have changed meaning."
force = "shall"
side  = "decoder"
# seed: RFC15-01

[[clause]]
id    = "RFC0015-S-4.3-5"
ref   = "§Compatibility policy, Warnings bullet"
title = "Only the presence and shape of the warnings machinery are part of the compatibility contract; message contents, wording and size (not just the array's length -- also, e.g., a message's own character length) are explicitly outside it."
force = "definition"
side  = "both"
# seed: RFC15-25

[[clause]]
id    = "RFC0015-S-4.3-6"
ref   = "§Compatibility policy, 'consumer needs can add fields' sentence"
title = "The minor/major split is meant to let a consumer's own field needs be added in a minor version without a schema redesign or a competing artifact."
force = "informative"
side  = "both"
# seed: none
# applicability-hint: not-applicable (informative)

[[clause]]
id    = "RFC0015-S-4.3-7"
ref   = "§Compatibility policy, Semver-zero rule"
title = "While the flag stays -Z gated, 0.x minor/major distinctions express intent only (a breaking change may land in a 0.x minor bump): a consumer must assert an exact accepted 0.x minor (e.g. == \\\\\\\"0.1.0\\\\\\\", or a small verified allow-list) and refuse any other 0.x value as an unknown major, checking schema_version before interpreting the rest of the document; backward compatibility as a promise starts only at 1.0."
force = "shall"
side  = "decoder"
# seed: RFC15-01

