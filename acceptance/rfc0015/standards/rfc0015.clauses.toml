[[clause]]
id    = "RFC0015-S-3.3-17"
ref   = "§Reading the results, PARTIAL/NO_HARNESSES_SELECTED trust-guarantee (split from S-3.3-11)"
title = "run_state PARTIAL and NO_HARNESSES_SELECTED are each trustworthy, finished exports (of missing results, or of an empty selection, respectively) -- but neither is complete verification evidence."
force = "definition"
side  = "both"
# seed: RFC15-05
# applicability-hint: applicable, PR 2

[[clause]]
id    = "RFC0015-S-3.3-18"
ref   = "§Reading the results, INCOMPLETE/missing-file unfinished-export rule (split from S-3.3-11)"
title = "run_state INCOMPLETE, or a missing export file altogether, both mean export did not finish (a write failure or abnormal termination), never complete verification evidence."
